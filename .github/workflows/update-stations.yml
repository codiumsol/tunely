name: Update stations (nightly)

# Every night: download the most popular stations of ~110 countries (same rules
# for every country), test every stream, remove dead ones and save
# data/stations.json. The app downloads this
# file on start, so users get fixes without any app update.
on:
  schedule:
    # Four times a day (21 Oct 2026, Asim: dead stations must disappear
    # fast): 02:13, 08:13, 14:13, 20:13 Pakistan time. Free (public repo).
    - cron: "13 3,9,15,21 * * *"
  workflow_dispatch:        # "Run workflow" button for a manual refresh
    inputs:
      trial:
        description: "Trial run: write data/trial/ only, leave the real list alone"
        type: boolean
        default: false

permissions:
  contents: write

# Never two runs at once (they would both write the lists); a new one waits.
concurrency:
  group: update-stations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and test station list
        env:
          TRIAL: ${{ inputs.trial && '1' || '' }}
          # Equal rules for every country (checked with two trial runs on
          # 18 Oct 2026). To go back to the old Pakistan-first rules for a
          # night, set this to ''.
          EQUAL: '1'
          # Per-country files data/c/*.json + data/index.json (trial OK
          # 19 Oct 2026: 7,633 stations, files <= 44 KB). '' = off.
          SHARDS: '1'
          # Every country the directory knows with 10+ stations, not only the
          # core list (19 Oct 2026). '' = only the core list.
          ALL_COUNTRIES: '1'
          # Every station of every country: pages 2, 3 ... (+ search files),
          # long tail tested weekly; published to Cloudflare only (20 Oct 2026).
          TAIL: '1'
          # Re-test EVERY station on every run (not 1/7 of the tail per week),
          # so a station that died is gone within ~6 hours (21 Oct 2026).
          TAIL_FULL: '1'
        run: python3 scripts/update_stations.py

      # Copy of the finished lists on Cloudflare Pages (free, fast everywhere):
      # https://tunely-data.pages.dev/data/... The app reads there first and
      # falls back to GitHub. Skipped on trial runs or without the secrets.
      - name: Publish to Cloudflare Pages
        if: ${{ !inputs.trial }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set - skipped."; exit 0
          fi
          mkdir -p public/data
          cp data/stations.json data/report.json public/data/
          [ -f data/index.json ] && cp data/index.json public/data/
          [ -d data/c ] && cp -r data/c public/data/c
          [ -f data/tail_state.json ] && cp data/tail_state.json public/data/
          printf '%s\n' '/*' \
            '  Access-Control-Allow-Origin: *' \
            '  Cache-Control: public, max-age=600' > public/_headers
          npx --yes wrangler@4 pages project create tunely-data --production-branch=main || true
          npx --yes wrangler@4 pages deploy public --project-name=tunely-data --branch=main --commit-dirty=true
          # Check it really is there.
          sleep 20
          curl -fsS https://tunely-data.pages.dev/data/index.json | head -c 200; echo

      - name: Save if anything changed
        run: |
          git config user.name "tunely-bot"
          git config user.email "tunely-bot@users.noreply.github.com"
          if [ -n "${{ inputs.trial && '1' || '' }}" ]; then
            git add data/trial
          else
            git add data/stations.json data/report.json data/missing.json
            [ -d data/c ] && git add -A data/c data/index.json
          fi
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "${{ inputs.trial && 'Trial station run' || 'Nightly station update' }}"
            # Someone may have pushed while the test ran: put ours on top.
            git pull --rebase origin main
            git push
          fi
