name: Update stations (nightly)

# Every night: download the most popular stations of ~110 countries (same rules
# for every country), test every stream, remove dead ones and save
# data/stations.json. The app downloads this
# file on start, so users get fixes without any app update.
on:
  schedule:
    - cron: "13 21 * * *"   # 21:13 UTC = 02:13 Pakistan time
  workflow_dispatch:        # "Run workflow" button for a manual refresh
    inputs:
      trial:
        description: "Trial run: write data/trial/ only, leave the real list alone"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and test station list
        env:
          TRIAL: ${{ inputs.trial && '1' || '' }}
          # Equal rules for every country (checked with two trial runs on
          # 18 Oct 2026). To go back to the old Pakistan-first rules for a
          # night, set this to ''.
          EQUAL: '1'
        run: python3 scripts/update_stations.py

      - name: Save if anything changed
        run: |
          git config user.name "tunely-bot"
          git config user.email "tunely-bot@users.noreply.github.com"
          if [ -n "${{ inputs.trial && '1' || '' }}" ]; then
            git add data/trial
          else
            git add data/stations.json data/report.json data/missing.json
          fi
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "${{ inputs.trial && 'Trial station run' || 'Nightly station update' }}"
            # Someone may have pushed while the test ran: put ours on top.
            git pull --rebase origin main
            git push
          fi
