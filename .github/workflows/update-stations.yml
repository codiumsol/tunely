name: Update stations (nightly)

# Every night: download Pakistani/Urdu stations + ~70 countries, test every stream,
# remove dead ones and save data/stations.json. The app downloads this
# file on start, so users get fixes without any app update.
on:
  schedule:
    - cron: "13 21 * * *"   # 21:13 UTC = 02:13 Pakistan time
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and test station list
        run: python3 scripts/update_stations.py

      - name: Save if anything changed
        run: |
          git config user.name "tunely-bot"
          git config user.email "tunely-bot@users.noreply.github.com"
          git add data/stations.json data/report.json data/missing.json
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Nightly station update"
            # Someone may have pushed while the test ran: put ours on top.
            git pull --rebase origin main
            git push
          fi
