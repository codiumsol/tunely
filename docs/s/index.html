<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen on Tunely Radio</title>
<meta name="description" content="Live radio from Pakistan and the world. Open this station in Tunely Radio.">
<meta property="og:title" content="Listen live on Tunely Radio">
<meta property="og:description" content="Your home radio, anywhere. Tap to open this station.">
<meta name="theme-color" content="#101319">
<style>
  :root { --bg:#101319; --card:#1d2026; --text:#e1e2eb; --muted:#a8aab4; --accent:#ff5500; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background: radial-gradient(circle at 50% 0%, #3a1a0a 0%, var(--bg) 60%); color:var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
  .card { width:100%; max-width:380px; background:var(--card); border-radius:24px; padding:28px 22px;
          text-align:center; border:1px solid rgba(255,255,255,.06); box-shadow:0 20px 50px rgba(0,0,0,.5); }
  .logo { width:64px; height:64px; border-radius:18px; background:var(--accent); margin:0 auto 14px;
          display:flex; align-items:center; justify-content:center; font-size:30px; }
  .live { display:inline-flex; gap:6px; align-items:center; font-size:12px; font-weight:700;
          letter-spacing:.08em; color:#4ae176; }
  .live i { width:7px; height:7px; border-radius:50%; background:#4ae176; display:inline-block; }
  h1 { font-size:24px; margin:8px 0 4px; word-break:break-word; }
  p { color:var(--muted); margin:0 0 22px; font-size:14px; }
  a.btn { display:block; padding:14px; border-radius:999px; font-weight:700; text-decoration:none;
          margin-top:10px; }
  .open { background:var(--accent); color:#fff; box-shadow:0 8px 24px rgba(255,85,0,.35); }
  .store { background:rgba(255,255,255,.06); color:var(--text); }
</style>
</head>
<body>
<div class="card">
  <div class="logo" aria-hidden="true">📻</div>
  <span class="live"><i></i>LIVE</span>
  <h1 id="name">Tunely Radio</h1>
  <p>Your home radio, anywhere</p>
  <a class="btn open" id="open" href="#">Open in Tunely Radio</a>
  <a class="btn store" id="store" href="https://play.google.com/store/apps/details?id=com.tunely.radio">Get it on Google Play</a>
</div>
<script>
  // Shared link: …/s/?id=<station id>&n=<station name>
  var q = new URLSearchParams(location.search);
  var id = q.get('id') || '';
  var name = q.get('n');
  var store = 'https://play.google.com/store/apps/details?id=com.tunely.radio';
  if (name) {
    document.getElementById('name').textContent = name; // text only, never HTML
    document.title = name + ' – Tunely Radio';
  }
  // Android: opens the app on this station; without the app, Chrome goes
  // to the Play Store instead.
  var intent = 'intent://station/' + encodeURIComponent(id) +
      '#Intent;scheme=tunely;package=com.tunely.radio;S.browser_fallback_url=' +
      encodeURIComponent(store) + ';end';
  var isAndroid = /android/i.test(navigator.userAgent);
  var open = document.getElementById('open');
  if (isAndroid && id) {
    open.href = intent;
    location.href = intent; // try straight away; the button is the backup
  } else {
    open.href = store;
  }
</script>
</body>
</html>
